# Target Config file for Nuvoton NCT6692D/NCT6801D, NCT6832D/NCT6812D, NCT6694B, and NCT9650HB.

# Adapter based on what transport is active.
if [catch {transport select}] {
  echo "Error: unable to select a session transport. Can't continue."
  shutdown
}

proc swj_newdap {chip tag args} {
 if [using_jtag] {
     eval jtag newtap $chip $tag $args
 } elseif [using_swd] {
     eval swd newdap $chip $tag $args
 } else {
     echo "Error: transport '[ transport select ]' not supported by swj_newdap"
     shutdown
 }
}

# Set Chipname
if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
    echo "Using CHIPNAME: $_CHIPNAME"
} else {
	set _CHIPNAME nct_esio
}

if { [info exists CPUDAPID] } {
	set _CPUDAPID $CPUDAPID
} else {
    # SWD-DP ID
	set _CPUDAPID 0x2BA01477
}

# Work-area is a space in RAM used for flash programming
# By default use 32kB
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x8000
}

# Debug Adapter Target Settings
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUDAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x200C0000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# set default SWCLK frequency
adapter speed 4000

# Chip reset setup
#
# Background:
#   eSIO does not support hardware SRST, so the reset method must be one of the two
#   software-initiated ARM Cortex-M reset mechanisms:
#
#   - cortex_m reset_config sysresetreq
#       Asserts AIRCR.SYSRESETREQ, which resets the entire core domain (CPU core +
#       peripherals) but leaves the debug subsystem (DAP, CoreSight) powered.
#       After the reset completes, the CPU is expected to re-enter a halted state
#       (DHCSR.S_HALT=1) so that OpenOCD can regain control for "reset halt",
#       "reset init", and "program <filename>" commands.
#
#   - cortex_m reset_config vectreset
#       Asserts AIRCR.VECTRESET, which resets only the CPU core.  Peripherals are
#       NOT reset.  Because the debug logic stays fully active across the reset,
#       the CPU reliably asserts DHCSR.S_HALT after reset, allowing OpenOCD to halt
#       and regain control without timing out.
#
# Hardware Bug (NCT6692D/NCT6694B/NCT6832D):
#   When SYSRESETREQ is configured as the reset method, the MCU fails to assert
#   DHCSR.S_HALT after reset.  As a result, OpenOCD times out waiting for the target
#   to halt and the "program <filename>" command fails with:
#       "Error: timed out while waiting for target halted"
#
# Workaround:
#   Use VECTRESET as the reset method so that the CPU halts reliably after reset.
#   To compensate for the missing peripheral reset, the reset-assert-pre event handler
#   below explicitly issues a SYSRESETREQ before each reset, ensuring the core domain
#   (core + peripherals) is fully reset before VECTRESET is applied.

# HLA doesn't have cortex_m commands
if {![using_hla]} {
    cortex_m reset_config vectreset
}

# Use hard breakpoint type for gdb break commands.
gdb_breakpoint_override hard

# Shutdown OpenOCD when GDB detaches
$_TARGETNAME configure -event gdb-detach { shutdown }

# The reset-assert-pre event handler
#
# Workaround for the hardware bug described above (NCT6692D/NCT6694B/NCT6832D):
#   This handler fires before every VECTRESET and explicitly issues a SYSRESETREQ to perform
#   a full core domain reset (core + peripherals).  Without this step, peripherals would not
#   be reset across a VECTRESET-only reset sequence.
#
# If a full peripheral reset is not required, or if the target chip is not affected by the
# bug above, comment out this entire event handler.
#
$_TARGETNAME configure -event reset-assert-pre {
	echo "reset-assert-pre"

    # Enable DHCSR.C_HALT & DHCSR.C_DEBUGEN
    mww 0xE000EDF0 0xA05F0003

    # Enable DEMCR.VC_CORERESET
    mww 0xE000EDFC 0x00000001

    # Enable SYSRESETREQ reset (AIRCR.SYSRESETREQ=1) to cause a core domain reset
    # (core + peripherals).
    mww 0xE000ED0C 0x05FA0004

    # Wait for some time to allow the reset to complete. (Unit: msec)
    # Note: Raspberry Pi Debug Probe may need a longer delay (>= 130ms).
    sleep 200
}

# flash configuration
if { $_CHIPNAME in {"NCT6801D" "NCT6692D"} } {
    set _FLASHNAME $_CHIPNAME.private.flash
    flash bank $_FLASHNAME nct_esio 0x60000000 0 0 0 $_TARGETNAME $_CHIPNAME
# If needed, uncomment the following lines to enable other external flash banks.
#    set _FLASHNAME $_CHIPNAME.shared.flash
#    flash bank $_FLASHNAME nct_esio 0x64000000 0 0 0 $_TARGETNAME $_CHIPNAME
} elseif { $_CHIPNAME in {"NCT6812D" "NCT6832D" "NCT6694B" "NCT9650HB"} } {
    set _FLASHNAME $_CHIPNAME.internal.flash
    flash bank $_FLASHNAME nct_esio 0x00080000 0 0 0 $_TARGETNAME $_CHIPNAME
# If needed, uncomment the following lines to enable other external flash banks.
#    set _FLASHNAME $_CHIPNAME.private.flash
#    flash bank $_FLASHNAME nct_esio 0x60000000 0 0 0 $_TARGETNAME $_CHIPNAME
#    set _FLASHNAME $_CHIPNAME.shared.flash
#    flash bank $_FLASHNAME nct_esio 0x70000000 0 0 0 $_TARGETNAME $_CHIPNAME
#    set _FLASHNAME $_CHIPNAME.backup.flash
#    flash bank $_FLASHNAME nct_esio 0x80000000 0 0 0 $_TARGETNAME $_CHIPNAME
} else {
    echo "Unsupported CHIPNAME: $_CHIPNAME"
    shutdown
}
